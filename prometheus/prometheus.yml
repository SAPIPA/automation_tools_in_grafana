global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: userver
    metrics_path: /metrics
    scrape_interval: 5s

    static_configs:
      - targets:
          - app-1:8081
          - app-2:8081
